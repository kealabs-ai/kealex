  <rect x="792" y="308" width="338" height="30" rx="8" fill="#0d2a4a" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="810" cy="323" r="5" fill="#00C2A8" fill-opacity="0.7"/>
  <rect x="822" y="318" width="120" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
