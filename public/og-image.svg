  <text x="842" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Processos</text>
  <text x="842" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">248</text>

