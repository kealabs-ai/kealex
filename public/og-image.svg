  <rect x="1080" y="319" width="36" height="8" rx="4" fill="#00C2A8" fill-opacity="0.3"/>
  <text x="1098" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#00C2A8" text-anchor="middle">Ativo</text>

  <rect x="792" y="346" width="338" height="30" rx="8" fill="#0d2a4a" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="810" cy="361" r="5" fill="#F96313" fill-opacity="0.7"/>
  <rect x="822" y="356" width="100" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="822" y="365" width="70" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="1080" y="357" width="36" height="8" rx="4" fill="#F96313" fill-opacity="0.3"/>
  <text x="1098" y="364" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#F96313" text-anchor="middle">Prazo</text>

  <rect x="792" y="384" width="338" height="30" rx="8" fill="#0d2a4a" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="810" cy="399" r="5" fill="#00C2A8" fill-opacity="0.7"/>
  <rect x="822" y="394" width="140" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="822" y="403" width="90" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="1080" y="395" width="36" height="8" rx="4" fill="#00C2A8" fill-opacity="0.3"/>
  <text x="1098" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#00C2A8" text-anchor="middle">Ativo</text>

  <!-- AI Chat bubble -->
  <rect x="792" y="426" width="338" height="70" rx="12" fill="#00C2A8" fill-opacity="0.08" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="812" cy="446" r="10" fill="#00C2A8" fill-opacity="0.2"/>
  <text x="812" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00C2A8" text-anchor="middle" font-weight="700">AI</text>
  <rect x="830" y="438" width="180" height="6" rx="3" fill="#00C2A8" fill-opacity="0.4"/>
  <rect x="830" y="450" width="140" height="5" rx="2.5" fill="#00C2A8" fill-opacity="0.25"/>
  <rect x="830" y="461" width="100" height="5" rx="2.5" fill="#00C2A8" fill-opacity="0.15"/>
  <text x="1100" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00C2A8" text-anchor="middle">Kealex AI</text>

  <!-- Bottom domain -->
  <text x="935" y="590" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">kealex.com.br</text>
