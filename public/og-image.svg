  <rect x="852" y="225" width="28" height="55" rx="3" fill="#00C2A8" fill-opacity="0.4"/>
  <rect x="892" y="215" width="28" height="65" rx="3" fill="#00C2A8" fill-opacity="0.5"/>
  <rect x="932" y="205" width="28" height="75" rx="3" fill="#00C2A8" fill-opacity="0.65"/>
  <rect x="972" y="195" width="28" height="85" rx="3" fill="#00C2A8" fill-opacity="0.8"/>
  <rect x="1012" y="210" width="28" height="70" rx="3" fill="#F96313" fill-opacity="0.9"/>
  <!-- Chart line -->
