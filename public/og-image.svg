<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081B33"/>
      <stop offset="60%" stop-color="#0d2a4a"/>
      <stop offset="100%" stop-color="#0a3d3a"/>
    </linearGradient>
    <!-- Teal glow -->
    <radialGradient id="glow1" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00C2A8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <!-- Orange glow -->
    <radialGradient id="glow2" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#F96313" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F96313" stop-opacity="0"/>
    </radialGradient>
    <!-- Card shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00C2A8" stroke-width="0.4" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="url(#tealBar)"/>
  <linearGradient id="tealBar" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00C2A8"/>
    <stop offset="100%" stop-color="#F96313"/>
  </linearGradient>

  <!-- ── LOGO AREA ── -->
  <!-- Logo background pill -->
  <rect x="72" y="60" width="180" height="52" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.4"/>
  <!-- "K" lettermark -->
  <text x="96" y="97" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#00C2A8">K</text>
  <!-- Kealex wordmark -->
  <text x="122" y="97" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="1">ealex</text>
  <!-- by Kealabs -->
  <text x="96" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00C2A8" fill-opacity="0.8" letter-spacing="2">BY KEALABS AI</text>

  <!-- ── BADGE ── -->
  <rect x="72" y="148" width="268" height="30" rx="15" fill="#00C2A8" fill-opacity="0.15" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="92" cy="163" r="5" fill="#00C2A8"/>
  <text x="106" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#00C2A8" letter-spacing="1.5">SOFTWARE JURÍDICO COM IA · 2025</text>

  <!-- ── HEADLINE ── -->
  <text x="72" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Seu escritório cresce.</text>
  <text x="72" y="308" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#00C2A8" letter-spacing="-1">A IA trabalha por você.</text>

  <!-- Underline accent -->
  <path d="M 72 320 Q 380 314 688 320" stroke="#00C2A8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ── SUBHEADLINE ── -->
  <text x="72" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#94a3b8" letter-spacing="0.2">
    Processos · Prazos · Cobranças · Documentos · IA Jurídica Brasileira
  </text>

  <!-- ── STATS ROW ── -->
  <!-- Stat 1 -->
  <rect x="72" y="410" width="170" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="92" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#00C2A8">46%</text>
  <text x="92" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">mais produtividade</text>

  <!-- Stat 2 -->
  <rect x="258" y="410" width="170" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="278" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#00C2A8">3h/dia</text>
  <text x="278" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">economizadas</text>

  <!-- Stat 3 -->
  <rect x="444" y="410" width="170" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="464" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#00C2A8">500+</text>
  <text x="464" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8">escritórios ativos</text>

