  <text x="952" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#F96313" text-anchor="middle">7</text>

  <rect x="1012" y="112" width="118" height="52" rx="10" fill="#00C2A8" fill-opacity="0.15" stroke="#00C2A8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1071" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00C2A8" text-anchor="middle">Receita/mês</text>
  <text x="1071" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#00C2A8" text-anchor="middle">R$ 48k</text>

